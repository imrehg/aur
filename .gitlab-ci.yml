# Weekly check of all packages with an .nvchecker.toml against their upstream
# versions. The job fails when anything is out of date, so GitLab's failed
# pipeline email works as the notification.

version-check:
  image: archlinux:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - pacman -Syu --noconfirm --needed devtools nvchecker git
    # Fetch the latest AUR state over https rather than the pinned submodule commits
    - sed -i 's#ssh+git://aur@aur.archlinux.org#https://aur.archlinux.org#' .gitmodules
    - git submodule sync
    - git submodule update --init --remote
  script:
    # The pretty output's spinner breaks without a terminal, and the JSON mode
    # always exits 0, so evaluate the JSON result here
    - pkgctl version check --json --verbose $(dirname */.nvchecker.toml) > versions.json
    - |
      jq -r '.[] | "\(.pkgbase): local \(.local_version), upstream \(.upstream_version // "?") [\(
        if .status != "success" then "CHECK FAILED: \(.message)"
        elif .out_of_date then "OUT OF DATE"
        else "ok" end)]"' versions.json
    - jq -e 'all(.status == "success" and (.out_of_date | not))' versions.json > /dev/null
  artifacts:
    when: always
    paths:
      - versions.json
