# Weekly check of all packages with an .nvchecker.toml against their upstream
# versions. The job fails when anything is out of date, so GitLab's failed
# pipeline email works as the notification.

version-check:
  image: archlinux:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - pacman -Syu --noconfirm --needed devtools nvchecker git
    # Fetch the latest AUR state over https rather than the pinned submodule commits
    - sed -i 's#ssh+git://aur@aur.archlinux.org#https://aur.archlinux.org#' .gitmodules
    - git submodule sync
    - git submodule update --init --remote
  script:
    # The pretty output's spinner breaks when TERM is unset, and the JSON mode
    # always exits 0, so evaluate the JSON result here
    - pkgctl version check --json --verbose $(dirname */.nvchecker.toml) > versions.json
    # -git packages (pkgver like 1.4.0.r2.gabc123) are always "newer" than the
    # latest upstream tag, which pkgctl reports as a warning; treat that as ok
    - |
      cat > ok.jq <<'EOF'
      def check_ok: .status == "success"
        or (.status == "warning" and (.pkgbase | endswith("-git"))
            and .message == "local version is newer than upstream");
      EOF
    - |
      jq -r 'include "ok"; .[] | "\(.pkgbase): local \(.local_version), upstream \(.upstream_version // "?") [\(
        if (check_ok | not) then "CHECK FAILED: \(.message)"
        elif .out_of_date then "OUT OF DATE"
        else "ok" end)]"' -L . versions.json
    - jq -e -L . 'include "ok"; all(check_ok and (.out_of_date | not))' versions.json > /dev/null
  artifacts:
    when: always
    paths:
      - versions.json
